<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Plant App</title>
</head>

<body>

  <div class="widget-container">

    <div class="drag-region" data-tauri-drag-region>
      <span>Plants</span>
      <button id="close-btn" class="header-btn">✕</button>
    </div>

    <div class="content">

      <div class="calendar-widget">

        <div class="calendar-header">
          <button class="nav-btn" id="prevMonth">&lt;</button>
          <h3 id="monthYear">June 2026</h3>
          <button class="nav-btn" id="nextMonth">&gt;</button>
        </div>

        <div class="calendar-grid days-of-week">
          <div>S</div>
          <div>M</div>
          <div>T</div>
          <div>W</div>
          <div>T</div>
          <div>F</div>
          <div>S</div>
        </div>

        <div class="calendar-grid" id="calendarDays"></div>

      </div>

    </div>

  </div>

  <script src="widget.js"></script>
</body>

</html>
